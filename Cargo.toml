[package]
name = "puzzle8"
version = "0.1.0"
edition = "2021"
description = "Sliding-puzzle (8 → 15 → 24) optimal solver and compression study"
publish = false

[lib]
name = "puzzle8"
path = "src/lib.rs"

# Binaries: 8-puzzle (build_table, solve, stats) ship by default;
# 15-puzzle (build_pdb15, solve15, verify15) require feature flags.

[features]
default = []
parallel = ["dep:rayon"]
mmap = ["dep:memmap2"]
sha = ["dep:sha2"]
# Umbrella enabling the full 15-puzzle CLI surface.
puzzle15 = ["parallel", "mmap"]
# Umbrella enabling the full 24-puzzle CLI surface.
puzzle24 = ["parallel", "mmap"]

[dependencies]
rayon = { version = "1.10", optional = true }
memmap2 = { version = "0.9", optional = true }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]

[[bin]]
name = "build_pdb15"
required-features = ["parallel", "mmap", "sha"]

[[bin]]
name = "solve15"
required-features = ["mmap"]

[[bin]]
name = "enumerate15"
required-features = ["mmap", "parallel"]

[[bin]]
name = "enum_expand15"
required-features = ["mmap"]

[[bin]]
name = "build_pdb24"
required-features = ["parallel", "mmap", "sha"]

[[bin]]
name = "solve24"
required-features = ["mmap"]

[[bin]]
name = "verify15"
required-features = ["mmap"]

[[bin]]
name = "build_pol8"
required-features = ["sha"]

[[bin]]
name = "build_feat8"
required-features = ["sha"]

[[bin]]
name = "build_adj8"
required-features = ["sha"]

[[example]]
name = "korf100_bench"
required-features = ["mmap"]

[[example]]
name = "antipode_anchor15"
required-features = ["mmap", "parallel"]

[[example]]
name = "antipode_search15"
required-features = ["mmap", "parallel"]

[[example]]
name = "dup_probe"
required-features = ["mmap"]

[profile.release]
lto = true
codegen-units = 1
