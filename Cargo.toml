[package]
name = "puzzle8"
version = "0.1.0"
edition = "2021"
description = "Sliding-puzzle (8 → 15 → 24) optimal solver and compression study"
publish = false

[lib]
name = "puzzle8"
path = "src/lib.rs"

[lints.clippy]
# `needless_range_loop` mostly false-fires in this numeric codebase on deliberate
# index math — diagonal writes (`m[d][d]`), bit positions (`1 << c`),
# mixed-radix/factorial ranking arithmetic, and W×W matrix packing — where the
# `for i in 0..n` form is clearer than clippy's iterator/`enumerate` rewrite.
needless_range_loop = "allow"

# Binaries: 8-puzzle (build_table, solve, stats) ship by default;
# 15-puzzle (build_pdb15, solve15, verify15) require feature flags.

[features]
# `parallel` and `mmap` are on by default: every driver and almost every example
# needs them, so a bare `cargo test` / `cargo clippy` builds the whole workspace.
# `--no-default-features` gives a lean 15-puzzle build: the 24-puzzle module is
# gated on `mmap` and omitted. Targets that require these features
# declare `required-features` and are skipped rather than failing to compile.
default = ["parallel", "mmap"]
parallel = ["dep:rayon"]
mmap = ["dep:memmap2"]
survivor-dump = []
sha = ["dep:sha2"]
# Umbrella enabling the full 15-puzzle CLI surface.
puzzle15 = ["parallel", "mmap"]
# Umbrella enabling the full 24-puzzle CLI surface.
puzzle24 = ["parallel", "mmap"]
# Per-component call counters in the IDA* verifier (LC/WD/ZPDB advances,
# ProjectedState::apply, ZpdbLayout::rank). Off by default — the per-node
# counter bumps cost ~5-10% wall time. Turn on to derive accurate ns/call per
# component when paired with a samply profile (`enumerate15` prints totals).
verifier-stats = []
# Table-gated 24-puzzle tests that build the ~4.4 GB merged cWD map: the flat
# engine's frozen-oracle node-identity gate and the probe-locality/load-factor
# instruments. Deliberately a FEATURE and not `#[ignore]` — an ignored test still
# runs under `cargo test -- --ignored`, whereas these are not even compiled
# unless asked for. They share one process-wide table (see
# `cwd::shared_merged_cwd`), so the cost is ~4.4 GB once rather than per test.
#
#   cargo test --release --features cwd-table-tests -- --nocapture
cwd-table-tests = []
# In-situ hit/miss counters for the direct-mapped probe cache, reported per
# threshold. Off by default. Needed because the LRU model in `probe-locality` is
# fully associative and therefore blind to the CONFLICT misses a direct-mapped
# cache suffers — it under-predicted the 64K->256K win by ~14x.
probe-cache-stats = []
# Structural census of the search itself: per-tier consult/raise/prune counts,
# the advantage-by-slack histogram (a tier prunes only when advantage > slack,
# so this says directly what a slack gate would forfeit), and the distribution
# of surviving children per expanded node. A few relaxed atomics per consult —
# cheap enough to run at 146/148, unlike `k8-surplus-gate`.
search-census = []
# Tooling for the 2-bit absolute (surplus) re-encoding investigation: the
# surplus histogram with clamp-loss per cap, and the distinct-page working set
# replayed under both the 1-bit and 2-bit layouts. EXPENSIVE — six 25-cell
# scans per consult, ~12x wall time. Use at 144 only.
k8-surplus-gate = ["search-census"]
# Page-locality of the merged-table probe: records the 16 KiB page of every
# probed cell and runs it through fixed-size LRUs to produce a TLB hit-rate vs
# reach curve. Off by default (an LRU probe per node). No root needed.
probe-locality = []
# Named CPU performance counters (Apple kperf/kperfdata private API), read at
# each threshold boundary and printed by solve24. REQUIRES ROOT (sudo). Off by
# default. Counts are frequency-independent, so unlike timings this is valid on
# battery, and comparing thresholds within one process removes cross-run drift.
pmu-counters = []
# Per-threshold decomposition of the flat parallel driver's efficiency: busy
# fraction, worker ns/node, and the unit-time distribution against three makespan
# bounds (work/W, LPT, actual). Off by default. The measurement itself is free
# (two `Instant::now()` per work unit, ~4096 per threshold), so this feature gates
# only the stderr report.
parallel-profile = ["parallel"]
# 15-puzzle adversarial DAVI/REINFORCE ML proof-of-concept (candle-based).
# See TRAINING.md. CPU works wherever candle-core builds; Metal is enabled
# automatically on macOS via the target block below, with runtime CPU fallback
# through Device::metal_if_available.
ml = ["parallel", "dep:candle-core", "dep:candle-nn"]

[dependencies]
rayon = { version = "1.10", optional = true }
memmap2 = { version = "0.9", optional = true }
sha2 = { version = "0.10", optional = true }
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }

# macOS builds of the `ml` feature get the real Metal backend; other OSes fall
# back to candle's CPU backend. Cargo unions this with the base declaration.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.9", optional = true, features = ["metal"] }

