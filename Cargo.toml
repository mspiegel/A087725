[package]
name = "puzzle8"
version = "0.1.0"
edition = "2021"
description = "Sliding-puzzle (8 → 15 → 24) optimal solver and compression study"
publish = false

[lib]
name = "puzzle8"
path = "src/lib.rs"

# Binaries: 8-puzzle (build_table, solve, stats) ship by default;
# 15-puzzle (build_pdb15, solve15, verify15) require feature flags.

[features]
default = []
parallel = ["dep:rayon"]
mmap = ["dep:memmap2"]
sha = ["dep:sha2"]
# Umbrella enabling the full 15-puzzle CLI surface.
puzzle15 = ["parallel", "mmap"]
# Umbrella enabling the full 24-puzzle CLI surface.
puzzle24 = ["parallel", "mmap"]
# Per-component call counters in the IDA* verifier (LC/WD/ZPDB advances,
# ProjectedState::apply, ZpdbLayout::rank). Off by default — the per-node
# counter bumps cost ~5-10% wall time. Turn on to derive accurate ns/call per
# component when paired with a samply profile (`enumerate15` prints totals).
verifier-stats = []
# 15-puzzle adversarial DAVI/REINFORCE ML proof-of-concept (candle-based).
# See TRAINING.md. CPU works wherever candle-core builds; Metal is enabled
# automatically on macOS via the target block below, with runtime CPU fallback
# through Device::metal_if_available.
ml = ["parallel", "dep:candle-core", "dep:candle-nn"]

[dependencies]
rayon = { version = "1.10", optional = true }
memmap2 = { version = "0.9", optional = true }
sha2 = { version = "0.10", optional = true }
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }

# macOS builds of the `ml` feature get the real Metal backend; other OSes fall
# back to candle's CPU backend. Cargo unions this with the base declaration.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.9", optional = true, features = ["metal"] }

[dev-dependencies]

[[bin]]
name = "build_pdb15"
required-features = ["parallel", "mmap", "sha"]

[[bin]]
name = "build_zpdb15"
required-features = ["mmap", "parallel"]

[[bin]]
name = "solve15"
required-features = ["mmap"]

[[bin]]
name = "enumerate15"
required-features = ["mmap", "parallel"]

[[bin]]
name = "enum_expand15"
required-features = ["mmap"]

[[bin]]
name = "h_filter15"
required-features = ["mmap"]

[[bin]]
name = "enum_corner15"
required-features = ["mmap", "parallel"]

[[bin]]
name = "build_pdb24"
required-features = ["parallel", "mmap", "sha"]

[[bin]]
name = "build_wd24"
required-features = ["sha"]

[[bin]]
name = "solve24"
required-features = ["mmap", "parallel"]

[[bin]]
name = "verify15"
required-features = ["mmap"]

[[bin]]
name = "ml_probe"
required-features = ["ml"]

[[bin]]
name = "eval_ml15"
required-features = ["ml"]

[[bin]]
name = "train_ml15"
required-features = ["ml"]

[[bin]]
name = "train_ml24"
required-features = ["ml"]

[[bin]]
name = "eval_ml24"
required-features = ["ml"]

[[bin]]
name = "wdsearch_probe"
required-features = ["ml"]

[[bin]]
name = "solve_r"
required-features = ["ml"]

[[bin]]
name = "corridor_r"
required-features = ["ml"]

[[bin]]
name = "gen_corridors"
required-features = ["ml", "mmap"]

[[bin]]
name = "ml_bench"
required-features = ["ml"]

[[bin]]
name = "verify_antipodes15"
required-features = ["ml"]

[[bin]]
name = "build_pol8"
required-features = ["sha"]

[[bin]]
name = "build_feat8"
required-features = ["sha"]

[[bin]]
name = "build_adj8"
required-features = ["sha"]

[[example]]
name = "korf100_bench"
required-features = ["mmap"]

[[example]]
name = "corridor15"
required-features = ["mmap"]

[[example]]
name = "ladder24"
required-features = ["mmap", "parallel"]

[[example]]
name = "rceiling24"
required-features = ["parallel", "mmap"]

[[example]]
name = "dupprobe24"
required-features = ["parallel", "mmap"]

[[example]]
name = "antipode_anchor15"
required-features = ["mmap", "parallel"]

[[example]]
name = "antipode_search15"
required-features = ["mmap", "parallel"]

[[example]]
name = "dup_probe"
required-features = ["mmap"]

[profile.release]
lto = true
codegen-units = 1
# Disable unwinding tables on release builds — enumerate15's hot path never
# panics in steady state, and panic=abort lets LLVM skip landing-pad codegen
# for cleaner inlining and tighter code. Note: Cargo profiles are per-build,
# not per-binary, so this also applies to other release-built binaries.
panic = "abort"

[[example]]
name = "zpdb_bench15"
required-features = ["mmap", "parallel"]

[[example]]
name = "zpdb_profile15"
required-features = ["mmap", "parallel"]
